
name: Crear APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: administrador
            id: com.catalogo.admin
            name: Admin Catálogo Plus
            icon: admin
            splash_color: "#160B08"
          - file: visor
            id: com.catalogo.visor
            name: Catálogo Plus
            icon: visor
            splash_color: "#061638"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar proyecto Android
        run: |
          mkdir www
          cp ${{ matrix.file }}.html www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "${{ matrix.name }}" ${{ matrix.id }} --web-dir www
          npx cap add android
          npx cap sync android

      - name: Configurar pantalla de inicio
        env:
          SPLASH_COLOR: ${{ matrix.splash_color }}
        run: |
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/drawable

          cat > android/app/src/main/res/values/splash_colors.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="splash_background">${SPLASH_COLOR}</color>
          </resources>
          EOF

          cat > android/app/src/main/res/drawable/splash.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/splash_background" />
              <item>
                  <bitmap
                      android:src="@mipmap/ic_launcher"
                      android:gravity="center"
                      android:filter="true" />
              </item>
          </layer-list>
          EOF

          cat > android/app/src/main/res/drawable/splash_icon.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <bitmap xmlns:android="http://schemas.android.com/apk/res/android"
              android:src="@mipmap/ic_launcher"
              android:gravity="center"
              android:filter="true" />
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          styles = Path("android/app/src/main/res/values/styles.xml")
          content = styles.read_text(encoding="utf-8")

          pattern = r'(<style\s+name="AppTheme\.NoActionBarLaunch"[^>]*>)(.*?)(</style>)'
          match = re.search(pattern, content, re.DOTALL)

          if not match:
              raise SystemExit("No se encontró AppTheme.NoActionBarLaunch")

          block = match.group(2)

          items = {
              "android:background": "@drawable/splash",
              "windowSplashScreenBackground": "@color/splash_background",
              "windowSplashScreenAnimatedIcon": "@drawable/splash_icon",
              "windowSplashScreenIconBackgroundColor": "@android:color/transparent",
              "postSplashScreenTheme": "@style/AppTheme.NoActionBar"
          }

          for name, value in items.items():
              block = re.sub(
                  r'\s*<item\s+name="' + re.escape(name) + r'">.*?</item>',
                  '',
                  block,
                  flags=re.DOTALL
              )
              block += f'\n        <item name="{name}">{value}</item>'

          replacement = match.group(1) + block + "\n    " + match.group(3)
          content = content[:match.start()] + replacement + content[match.end():]
          styles.write_text(content, encoding="utf-8")
          PY

      - name: Poner los iconos
        run: |
          for d in android/app/src/main/res/mipmap-*dpi; do
            cp icon-${{ matrix.icon }}-512.png $d/ic_launcher.png
            cp icon-${{ matrix.icon }}-512.png $d/ic_launcher_round.png
            cp icon-${{ matrix.icon }}-512.png $d/ic_launcher_foreground.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Usar llave fija
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ${{ matrix.file }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.file }}
          path: ${{ matrix.file }}.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK ${{ github.run_number }}
          files: apks/*.apk

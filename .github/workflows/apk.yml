name: Crear APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: administrador
            id: com.catalogo.admin
            name: Admin Catálogo
            icon: admin
          - file: visor
            id: com.catalogo.visor
            name: Catálogo
            icon: visor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar proyecto Android
        run: |
          mkdir www
          cp ${{ matrix.file }}.html www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "${{ matrix.name }}" ${{ matrix.id }} --web-dir www
          npx cap add android
          npx cap sync android
      - name: Poner el ícono
        run: |
          for d in android/app/src/main/res/mipmap-*dpi; do
            cp icon-${{ matrix.icon }}-192.png $d/ic_launcher.png
            cp icon-${{ matrix.icon }}-192.png $d/ic_launcher_round.png
            cp icon-${{ matrix.icon }}-192.png $d/ic_launcher_foreground.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Guardar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ${{ matrix.file }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.file }}
          path: ${{ matrix.file }}.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK ${{ github.run_number }}
          files: apks/*.apk

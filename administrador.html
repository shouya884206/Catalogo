<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo – Administrador</title>
<style>:root{--bg:#f7f4ef;--card:#fff;--tx:#1d1b18;--mu:#8a8378;--ac:#c4552d;--bd:#e9e3d9;--ph:#efeae1;--ok:#2e8b57;--wn:#c77d12;--bad:#c0392b;--sh:0 1px 2px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.05);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14120e;--card:#1f1c17;--tx:#f3eee5;--mu:#a0998c;--ac:#e8794f;--bd:#312d26;--ph:#27231d;--ok:#5cc28a;--wn:#e8a94a;--bad:#ef6a5b;--sh:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14120e;--card:#1f1c17;--tx:#f3eee5;--mu:#a0998c;--ac:#e8794f;--bd:#312d26;--ph:#27231d;--ok:#5cc28a;--wn:#e8a94a;--bad:#ef6a5b;--sh:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;max-width:900px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:18px 18px 12px}
h1{font-size:26px;font-weight:800;letter-spacing:-.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ttl{flex:1;min-width:0}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 16px;background:var(--ac);color:#fff;font-weight:700}
button:active{transform:scale(.98)}
button.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button.ic{width:44px;height:44px;padding:0;font-size:20px;flex:none}
button.danger{background:var(--bad)}
button.opt{background:transparent;color:var(--bad);border:1px solid var(--bd);text-align:left}
button:disabled{opacity:.5}
.hid{display:none!important}
input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;min-width:0}
input:focus{outline:2px solid var(--ac);outline-offset:-1px}
.row,.new{display:flex;gap:8px;padding:0 18px 14px}
.row input,.new input{flex:1}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 18px 12px}
.pill{display:inline-block;font-size:12.5px;color:var(--mu);background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:4px 10px}
.pill:empty{display:none}
.pill.ok{color:var(--ok)}
.pill.wn{color:var(--wn)}
div#st:not(.pill){padding:0 18px 8px;color:var(--mu);font-size:13px;min-height:22px}
#res{overflow:auto;flex:1}
h2{font-size:14px;color:var(--mu);padding:4px 18px 8px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:0 18px 24px;overflow:auto}
@media (min-width:560px){.grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}
.cat{background:var(--card);border-radius:20px;overflow:hidden;cursor:pointer;box-shadow:var(--sh);border:1px solid var(--bd)}
.cov{position:relative;aspect-ratio:1/1;background:var(--ph);display:flex;align-items:center;justify-content:center;font-size:36px;color:var(--mu)}
.cov img{width:100%;height:100%;object-fit:cover}
.chip{position:absolute;left:8px;top:8px;background:var(--wn);color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px}
.cat b{display:block;padding:12px 14px 2px;font-size:16px}
.cat small{display:block;padding:0 14px 14px;color:var(--mu);font-size:13px}
.empty{padding:48px 24px;text-align:center;color:var(--mu);line-height:1.6}
.set{padding:18px;display:flex;flex-direction:column;gap:12px}
.set p{color:var(--mu);line-height:1.5;font-size:14px}
.car{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;min-height:0}
.car::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;padding:0 14px;min-height:0;gap:10px}
.sl>img,.ph{flex:1;min-height:0;border-radius:22px;background:var(--ph);box-shadow:var(--sh)}
.sl>img{width:100%;object-fit:contain}
.ph{position:relative;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.badge{position:absolute;left:12px;top:12px;background:var(--wn);color:#fff;font-size:12.5px;font-weight:700;border-radius:99px;padding:4px 11px}
.cap{display:flex;gap:8px}
.cap input{flex:1;text-align:center;font-weight:600}
.ct{font-size:20px;font-weight:700;text-align:center;padding:4px 0 6px;min-height:36px}
.lnk{background:transparent;color:var(--mu);font-weight:500;text-decoration:underline;padding:4px}
.cnt{text-align:center;color:var(--mu);font-size:13px;padding:10px 0 14px}
.ban{margin:0 18px 12px;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--wn);font-size:14px;display:flex;flex-direction:column;gap:10px;line-height:1.4}
.ban div{display:flex;gap:8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{width:100%;max-width:520px;background:var(--card);border-radius:24px 24px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.sheet h3{font-size:19px}
.sheet p{color:var(--mu);line-height:1.45;font-size:14.5px}
</style>
</head>
<body>
<div id="app"></div>
<script>
function ld(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var cfg=ld('cfg',{}),S=ld('S',{cats:[],imgs:[]}),D=ld('D',[]),Q=ld('Q',[]),IM={},scr='home',cur=null,idx=0,ST='',busy=false;
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)};
var by=function(a,b){return(a.t||0)-(b.t||0)};
function keep(){sv('S',S);sv('D',D);sv('Q',Q)}
function imgsOf(id){return S.imgs.filter(function(m){return m.cat===id}).sort(by)}
function draftsOf(id){return D.filter(function(m){return m.cat===id}).sort(by)}
function slides(id){return imgsOf(id).map(function(m){return{m:m,d:false}}).concat(draftsOf(id).map(function(m){return{m:m,d:true}}))}
function idb(){return new Promise(function(r,j){var q=indexedDB.open('cimg',1);q.onupgradeneeded=function(){q.result.createObjectStore('i')};q.onsuccess=function(){r(q.result)};q.onerror=function(){j(q.error)}})}
async function iget(k){try{var d=await idb();return await new Promise(function(r){var q=d.transaction('i').objectStore('i').get(k);q.onsuccess=function(){r(q.result)};q.onerror=function(){r(null)}})}catch(e){return null}}
async function iput(k,v){try{var d=await idb();d.transaction('i','readwrite').objectStore('i').put(v,k)}catch(e){}}
async function idel(k){try{var d=await idb();d.transaction('i','readwrite').objectStore('i').delete(k)}catch(e){}}
async function need(id){
  if(IM[id])return IM[id];
  var d=await iget(id);
  if(!d&&cfg.url){try{var r=await(await fetch(cfg.url+'?a=img&id='+id)).json();if(r.ok){d='data:'+r.mime+';base64,'+r.data;iput(id,d)}}catch(e){}}
  if(d){IM[id]=d;document.querySelectorAll('img[data-i="'+id+'"]').forEach(function(e){e.src=d})}
  return d;
}
function hydrate(){document.querySelectorAll('img[data-i]').forEach(function(e){if(!e.getAttribute('src'))need(e.dataset.i)})}
function im(m,alt){return '<img data-i="'+m.id+'" alt="'+esc(alt||'')+'"'+(IM[m.id]?' src="'+IM[m.id]+'"':'')+'>'}
function toData(f){return new Promise(function(res){var u=URL.createObjectURL(f),i=new Image();i.onload=function(){var s=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.85))};i.onerror=function(){res(null)};i.src=u})}
function setSt(s){ST=s;var e=$('#st');if(e){e.textContent=s;e.className='pill'+(s.indexOf('✓')>-1?' ok':(/conexi|PIN/.test(s)?' wn':''))}}
function push(o){Q.push(o);keep();sync()}
async function sync(){
  if(busy||!cfg.url)return;busy=true;setSt('Sincronizando…');
  try{
    while(Q.length){
      var o=Q[0],b=Object.assign({pin:cfg.pin},o);
      if(o.op==='addImg'){var d=await iget(o.id);if(d){b.data=d.split(',')[1];b.mime='image/jpeg'}else{Q.shift();keep();continue}}
      var r=await(await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b)})).json();
      if(!r.ok&&r.err==='pin'){setSt('PIN incorrecto: revísalo en ⚙');busy=false;return}
      Q.shift();keep();
    }
    var l=await(await fetch(cfg.url+'?a=list&_='+Date.now())).json();
    if(l.ok&&!Q.length){S={cats:l.cats,imgs:l.imgs};keep();refresh()}
    setSt('Sincronizado ✓');
  }catch(e){setSt(Q.length?'Sin conexión: '+Q.length+' pendiente(s)':'Sin conexión')}
  busy=false;
}
function modal(h){closeM();var m=document.createElement('div');m.className='ov';m.innerHTML='<div class="sheet">'+h+'</div>';m.addEventListener('click',function(e){if(e.target===m)m.remove()});document.body.appendChild(m)}
function closeM(){var m=$('.ov');if(m)m.remove()}
function setup(){
  scr='set';
  $('#app').innerHTML='<header><h1>Configuración</h1>'+(cfg.url?'<button class="g" data-a="home">Cerrar</button>':'')+'</header><div class="set"><p>Pega el enlace de tu Apps Script (termina en /exec) y la clave PIN que pusiste en el código.</p><input id="u" placeholder="https://script.google.com/macros/s/…/exec" value="'+esc(cfg.url)+'"><input id="p" placeholder="PIN" value="'+esc(cfg.pin)+'"><button data-a="savecfg">Guardar</button></div>';
}
function home(){
  if(!cfg.url||!cfg.pin){setup();return}
  scr='home';cur=null;
  var h='<header><div class="ttl"><h1>Administrador</h1><span id="st" class="pill"></span></div><button class="ic g" data-a="setup">⚙</button></header><div class="new"><input id="cn" placeholder="Nueva categoría" maxlength="60"><button data-a="addcat">Crear</button></div>';
  if(!S.cats.length)h+='<div class="empty">Aún no hay categorías.<br>Crea la primera arriba y luego agrega tus imágenes.</div>';
  else h+='<div class="grid">'+S.cats.slice().sort(by).map(function(c){var l=imgsOf(c.id),n=draftsOf(c.id).length,m=l[0]||draftsOf(c.id)[0];return '<div class="cat" data-a="open" data-id="'+c.id+'"><div class="cov">'+(m?im(m):'▦')+(n?'<span class="chip">'+n+' sin guardar</span>':'')+'</div><b>'+esc(c.name)+'</b><small>'+l.length+(l.length==1?' imagen':' imágenes')+'</small></div>'}).join('')+'</div>';
  $('#app').innerHTML=h;setSt(ST);hydrate();
}
function catView(kp){
  var c=S.cats.find(function(x){return x.id===cur});if(!c){home();return}
  scr='cat';var L=slides(c.id),nd=L.filter(function(x){return x.d}).length,g=kp?idx:0;
  var h='<header><button class="ic g" data-a="home">←</button><h1>'+esc(c.name)+'</h1><button class="ic g" data-a="menu">⋯</button></header><div class="bar"><span id="st" class="pill"></span><button data-a="add">+ Imagen</button></div>';
  if(nd)h+='<div class="ban"><span><b>'+nd+(nd==1?' imagen sin guardar.':' imágenes sin guardar.')+'</b> Todavía no aparecen en el visor.</span><div><button data-a="saveall">Guardar '+(nd==1?'imagen':'todas')+'</button><button class="g" data-a="discardall">Descartar</button></div></div>';
  if(!L.length)h+='<div class="empty" style="flex:1">Esta categoría está vacía.<br>Toca “+ Imagen” para agregar fotos.</div>';
  else h+='<div class="car" id="car">'+L.map(function(x){var m=x.m,i=m.id;return '<div class="sl"><div class="ph">'+im(m,m.name)+(x.d?'<span class="badge">Sin guardar</span>':'')+'</div><div class="cap"><input data-a="nm" data-d="'+(x.d?1:0)+'" data-id="'+i+'" value="'+esc(m.name)+'" placeholder="Nombre (opcional)" maxlength="80">'+(x.d?'<button data-a="savedraft" data-id="'+i+'">Guardar</button>':'<button class="hid" data-a="savename" data-id="'+i+'">Guardar</button>')+'</div>'+(x.d?'<button class="lnk" data-a="discard" data-id="'+i+'">Descartar esta imagen</button>':'')+'</div>'}).join('')+'</div><div class="cnt" id="cnt"></div>';
  $('#app').innerHTML=h;setSt(ST);hydrate();
  var car=$('#car');
  if(car){g=Math.max(0,Math.min(g,L.length-1));var u=function(){idx=Math.round(car.scrollLeft/car.clientWidth);$('#cnt').textContent=(idx+1)+' / '+L.length};car.addEventListener('scroll',u);car.scrollLeft=g*car.clientWidth;u()}
}
function refresh(){var a=document.activeElement;if(a&&a.tagName==='INPUT')return;if(scr==='cat')catView(true);else if(scr==='home')home()}
function saveDraft(id,b){
  var d=D.find(function(x){return x.id===id});if(!d)return;var nm=(d.name||'').trim();
  D=D.filter(function(x){return x.id!==id});S.imgs.push({id:id,cat:d.cat,name:nm,t:d.t});Q.push({op:'addImg',id:id,cat:d.cat,name:nm,t:d.t});keep();
  if(!b){idx=slides(cur).findIndex(function(x){return x.m.id===id});catView(true);sync()}
}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');if(!t)return;var a=t.dataset.a,id=t.dataset.id;
  if(a==='home')home();
  else if(a==='setup')setup();
  else if(a==='closem')closeM();
  else if(a==='savecfg'){cfg={url:$('#u').value.trim(),pin:$('#p').value.trim()};sv('cfg',cfg);home();sync()}
  else if(a==='open'){cur=id;var f=slides(id).findIndex(function(x){return x.d});idx=f>-1?f:0;catView(true)}
  else if(a==='addcat'){var v=$('#cn').value.trim();if(!v)return;var c={id:uid(),name:v,t:Date.now()};S.cats.push(c);push({op:'addCat',id:c.id,name:c.name,t:c.t});home()}
  else if(a==='add'){var f=document.createElement('input');f.type='file';f.accept='image/*';f.multiple=true;f.onchange=async function(){
    var fs=Array.prototype.slice.call(f.files),nf=null;
    for(var i=0;i<fs.length;i++){var d=await toData(fs[i]);if(!d)continue;var m={id:uid(),cat:cur,name:'',t:Date.now()+i};if(!nf)nf=m.id;IM[m.id]=d;await iput(m.id,d);D.push(m)}
    keep();if(nf)idx=slides(cur).findIndex(function(x){return x.m.id===nf});catView(true)};f.click()}
  else if(a==='savedraft')saveDraft(id);
  else if(a==='saveall'){draftsOf(cur).forEach(function(d){saveDraft(d.id,1)});idx=Math.max(0,Math.min(idx,slides(cur).length-1));catView(true);sync()}
  else if(a==='savename'){var m=S.imgs.find(function(x){return x.id===id}),inp=t.parentNode.querySelector('input');if(m){m.name=inp.value.trim();push({op:'renameImg',id:id,name:m.name})}t.classList.add('hid');inp.blur()}
  else if(a==='discard'){D=D.filter(function(x){return x.id!==id});idel(id);keep();idx=Math.max(0,idx-1);catView(true)}
  else if(a==='discardall'){var n=draftsOf(cur).length;modal('<h3>¿Descartar '+(n==1?'la imagen':n+' imágenes')+'?</h3><p>No se han guardado, así que no están en el visor. Se perderán.</p><button data-a="closem">Volver</button><button class="danger" data-a="dodiscard">Sí, descartar</button>')}
  else if(a==='dodiscard'){closeM();draftsOf(cur).forEach(function(d){idel(d.id)});D=D.filter(function(x){return x.cat!==cur});keep();idx=0;catView(true)}
  else if(a==='menu'){var c=S.cats.find(function(x){return x.id===cur}),x=slides(cur)[idx],h='<h3>Opciones</h3>';
    if(x&&!x.d)h+='<button class="opt" data-a="askdel" data-id="'+x.m.id+'">Eliminar esta imagen'+(x.m.name?' “'+esc(x.m.name)+'”':'')+'</button>';
    h+='<button class="opt" data-a="askdelcat">Eliminar la categoría “'+esc(c.name)+'”</button><button class="g" data-a="closem">Cerrar</button>';modal(h)}
  else if(a==='askdel'){modal('<h3>¿Eliminar esta imagen?</h3><p>Desaparecerá también del visor de todos tus trabajadores. No se puede deshacer.</p><button data-a="closem">No, conservar</button><button class="danger" data-a="dodel" data-id="'+id+'">Sí, eliminar</button>')}
  else if(a==='dodel'){closeM();S.imgs=S.imgs.filter(function(m){return m.id!==id});idel(id);idx=Math.max(0,idx-1);push({op:'delImg',id:id});catView(true)}
  else if(a==='askdelcat'){var c2=S.cats.find(function(x){return x.id===cur}),n2=imgsOf(cur).length;modal('<h3>¿Eliminar “'+esc(c2.name)+'”?</h3><p>Se borrarán también sus '+n2+(n2==1?' imagen':' imágenes')+' del visor de todos. No se puede deshacer.</p><button data-a="closem">No, conservar</button><button class="danger" data-a="dodelcat">Sí, eliminar categoría</button>')}
  else if(a==='dodelcat'){closeM();var cid=cur;slides(cid).forEach(function(x){idel(x.m.id)});S.imgs=S.imgs.filter(function(m){return m.cat!==cid});D=D.filter(function(m){return m.cat!==cid});S.cats=S.cats.filter(function(c){return c.id!==cid});push({op:'delCat',id:cid});home()}
});
document.addEventListener('input',function(e){
  var t=e.target;if(t.dataset.a!=='nm')return;
  if(t.dataset.d==='1'){var d=D.find(function(x){return x.id===t.dataset.id});if(d){d.name=t.value;sv('D',D)}}
  else{var m=S.imgs.find(function(x){return x.id===t.dataset.id}),b=t.parentNode.querySelector('[data-a="savename"]');if(m&&b)b.classList.toggle('hid',t.value.trim()===(m.name||''))}
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='cn')document.querySelector('[data-a="addcat"]').click()});
window.addEventListener('online',sync);
document.addEventListener('visibilitychange',function(){if(!document.hidden)sync()});
setInterval(sync,60000);
home();sync();
</script>
</body>
</html>

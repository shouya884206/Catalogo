<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest-visor.json">
<meta name="theme-color" content="#2c3e50">
<link rel="apple-touch-icon" href="icon-visor-192.png">
<title>Catálogo</title>
<style>:root{--bg:#f7f4ef;--card:#fff;--tx:#1d1b18;--mu:#8a8378;--ac:#c4552d;--bd:#e9e3d9;--ph:#efeae1;--ok:#2e8b57;--wn:#c77d12;--bad:#c0392b;--sh:0 1px 2px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.05);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14120e;--card:#1f1c17;--tx:#f3eee5;--mu:#a0998c;--ac:#e8794f;--bd:#312d26;--ph:#27231d;--ok:#5cc28a;--wn:#e8a94a;--bad:#ef6a5b;--sh:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14120e;--card:#1f1c17;--tx:#f3eee5;--mu:#a0998c;--ac:#e8794f;--bd:#312d26;--ph:#27231d;--ok:#5cc28a;--wn:#e8a94a;--bad:#ef6a5b;--sh:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;max-width:900px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:18px 18px 12px}
h1{font-size:26px;font-weight:800;letter-spacing:-.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ttl{flex:1;min-width:0}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 16px;background:var(--ac);color:#fff;font-weight:700}
button:active{transform:scale(.98)}
button.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button.ic{width:44px;height:44px;padding:0;font-size:20px;flex:none}
button.danger{background:var(--bad)}
button.opt{background:transparent;color:var(--bad);border:1px solid var(--bd);text-align:left}
button:disabled{opacity:.5}
.hid{display:none!important}
input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;min-width:0}
input:focus{outline:2px solid var(--ac);outline-offset:-1px}
.row,.new{display:flex;gap:8px;padding:0 18px 14px}
.row input,.new input{flex:1}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 18px 12px}
.pill{display:inline-block;font-size:12.5px;color:var(--mu);background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:4px 10px}
.pill:empty{display:none}
.pill.ok{color:var(--ok)}
.pill.wn{color:var(--wn)}
div#st:not(.pill){padding:0 18px 8px;color:var(--mu);font-size:13px;min-height:22px}
#res{overflow:auto;flex:1}
h2{font-size:14px;color:var(--mu);padding:4px 18px 8px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:0 18px 24px;overflow:auto}
@media (min-width:560px){.grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}
.cat{background:var(--card);border-radius:20px;overflow:hidden;cursor:pointer;box-shadow:var(--sh);border:1px solid var(--bd)}
.cov{position:relative;aspect-ratio:1/1;background:var(--ph);display:flex;align-items:center;justify-content:center;font-size:36px;color:var(--mu)}
.cov img{width:100%;height:100%;object-fit:cover}
.chip{position:absolute;left:8px;top:8px;background:var(--wn);color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px}
.cat b{display:block;padding:12px 14px 2px;font-size:16px}
.cat small{display:block;padding:0 14px 14px;color:var(--mu);font-size:13px}
.empty{padding:48px 24px;text-align:center;color:var(--mu);line-height:1.6}
.set{padding:18px;display:flex;flex-direction:column;gap:12px}
.set p{color:var(--mu);line-height:1.5;font-size:14px}
.car{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;min-height:0}
.car::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;padding:0 14px;min-height:0;gap:10px}
.gmos{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:3px;width:100%;height:100%;background:var(--bd)}.gm{position:relative;background:#fff;overflow:hidden;min-height:0}.gm img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.gmore{position:absolute;inset:0;background:rgba(0,0,0,.55);color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center}
.gsl .gmos{flex:1;min-height:0;border-radius:22px;overflow:hidden;box-shadow:var(--sh)}.gver{font-size:13px;font-weight:600;color:var(--ac);margin-top:4px}
.gscroll{flex:1;overflow:auto;padding:0 14px 24px;min-height:0}.gstrip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.gstrip::-webkit-scrollbar{display:none}.gp{flex:0 0 78%;aspect-ratio:1;scroll-snap-align:center;position:relative;border-radius:18px;background:#fff;border:1px solid var(--bd);overflow:hidden}.gp img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.gnote{font-size:12px;color:var(--mu);margin:8px 2px 12px}.glist{display:flex;flex-direction:column;gap:8px}.gr{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:9px;box-shadow:var(--sh)}.gt{position:relative;width:54px;height:54px;flex:none;border-radius:10px;background:#fff;border:1px solid var(--bd);overflow:hidden}.gt img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.gi{flex:1;min-width:0}.gi b{display:block;font-size:15px}.gi small{color:var(--mu);font-size:12px}.gpr{font-weight:800;font-size:16px;color:var(--ac);white-space:nowrap}
#cg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:8px;background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:0 4px 18px rgba(0,0,0,.25);border-radius:99px;padding:8px 14px;font-size:13px;font-weight:600;white-space:nowrap;pointer-events:none}#cg[hidden]{display:none}#cg i{width:9px;height:9px;border-radius:50%;background:var(--wn);animation:cgp 1s infinite}#cg.ok i{background:var(--ok);animation:none}#cg.off i{animation:none}@keyframes cgp{50%{opacity:.3}}
.sl>img,.ph{flex:1;min-height:0;border-radius:22px;background:var(--ph);box-shadow:var(--sh)}
.sl>img{width:100%;object-fit:contain}
.ph{position:relative;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.badge{position:absolute;left:12px;top:12px;background:var(--wn);color:#fff;font-size:12.5px;font-weight:700;border-radius:99px;padding:4px 11px}
.cap{display:flex;gap:8px}
.cap input{flex:1;text-align:center;font-weight:600}
.ct{font-size:20px;font-weight:700;text-align:center;padding:4px 0 6px;min-height:36px}
.seg{display:flex;gap:6px;padding:0 18px 12px}.seg button{flex:1;padding:10px 4px;font-size:13px;line-height:1.15;background:var(--card);color:var(--tx);border:1px solid var(--bd)}.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}.tile{background:var(--card);border-radius:18px;overflow:hidden;cursor:pointer;box-shadow:var(--sh);border:1px solid var(--bd)}.tile .cov{aspect-ratio:1/1}.tile small{display:block;padding:8px 10px 10px;font-size:13px;font-weight:600;line-height:1.25}.tile small i{display:block;font-style:normal;font-weight:600;color:var(--ok);margin-top:2px}.tile small i.no{color:var(--bad)}
.pe{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px;flex-wrap:wrap}.pe .bg{font-size:10.5px;font-weight:800;color:#fff;background:#15803d;border-radius:6px;padding:4px 6px;white-space:nowrap}.pe .bg.no{background:#dc2626}.pe .pp{font-size:13.5px;font-weight:900;color:#1d1b18;background:#fde047;border-radius:99px;padding:4px 9px;white-space:nowrap}.sl .pe{justify-content:center;gap:10px;margin-top:4px}.sl .pe .bg{font-size:14px;padding:5px 11px}.sl .pe .pp{font-size:19px;padding:5px 15px}.cl{font-size:12px;color:#94a3b8;font-weight:600;letter-spacing:.2px}.ex{font-size:15px;font-weight:600;color:#22c55e;margin-top:2px}.ex.no{color:#ef4444}
.lnk{background:transparent;color:var(--mu);font-weight:500;text-decoration:underline;padding:4px}
.cnt{text-align:center;color:var(--mu);font-size:13px;padding:10px 0 14px}
.ban{margin:0 18px 12px;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--wn);font-size:14px;display:flex;flex-direction:column;gap:10px;line-height:1.4}
.ban div{display:flex;gap:8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{width:100%;max-width:520px;background:var(--card);border-radius:24px 24px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.sheet h3{font-size:19px}
.sheet p{color:var(--mu);line-height:1.45;font-size:14.5px}
</style>
</head>
<body>
<div id="app"></div><div id="cg" hidden></div>
<script>
function ld(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var cfg=ld('cfgv',{}),S=ld('Sv',{v:-1,cats:[],imgs:[],groups:[],mon:'C$'}),IM={},scr='home',cur=null,idx=0,q='',ST='';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var by=function(a,b){return(a.t||0)-(b.t||0)};
function imgsOf(id){return S.imgs.filter(function(m){return m.cat===id}).sort(by)}
/* Grupos: una sola publicación por grupo (sus miembros son los productos originales; no se crea ninguna imagen nueva) */
function gOf(id){return (S.groups||[]).find(function(g){return g.id===id})}
function gItem(g){var k={};S.imgs.forEach(function(m){k[m.id]=m});var ms=g.ids.map(function(i){return k[i]}).filter(Boolean);return ms.length?{isg:true,id:g.id,name:g.name,ms:ms,first:ms[0],t:ms[0].t||0,cat:g.cat}:null}
function collapse(l){var seen={},o=[];l.forEach(function(m){if(m.g){if(seen[m.g])return;seen[m.g]=1;var g=gOf(m.g),it=g&&gItem(g);if(it){o.push(it);return}}o.push(m)});return o}
function catItems(id){return collapse(imgsOf(id))}
function cov(it){return it.isg?it.first:it}
function money(n){var v=Number(n)||0;return (S.mon||'C$')+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function gMos(it){var m=it.ms,n=m.length,sh=m.slice(0,4);return '<div class="gmos">'+sh.map(function(x,i){return '<div class="gm">'+im(x,x.name)+(i===3&&n>4?'<span class="gmore">+'+(n-3)+'</span>':'')+'</div>'}).join('')+'</div>'}
function gDesde(it){var p=it.ms.map(function(x){return Number(x.pr)||0}).filter(function(v){return v>0});return p.length?' · desde '+money(Math.min.apply(null,p)):''}
function idb(){return new Promise(function(r,j){var o=indexedDB.open('cimgv',1);o.onupgradeneeded=function(){o.result.createObjectStore('i')};o.onsuccess=function(){r(o.result)};o.onerror=function(){j(o.error)}})}
async function iget(k){try{var d=await idb();return await new Promise(function(r){var o=d.transaction('i').objectStore('i').get(k);o.onsuccess=function(){r(o.result)};o.onerror=function(){r(null)}})}catch(e){return null}}
async function iput(k,v){try{var d=await idb();d.transaction('i','readwrite').objectStore('i').put(v,k)}catch(e){}}
var KEYLIST={};
function ik(m){return m.id+'.'+(m.iv||0)}
async function need(id){
  var m=S.imgs.find(function(x){return x.id===id});if(!m)return null;var k=ik(m);
  if(IM[k])return IM[k];
  var d=await iget(k);
  if(!d&&cfg.k){try{var r=await call({action:'cat_img',id:id});if(r.ok){d='data:'+r.mime+';base64,'+r.data;iput(k,d)}}catch(e){}}
  if(d){IM[k]=d;document.querySelectorAll('img[data-i="'+id+'"]').forEach(function(e){e.src=d});if(PF)cgPintar()}
  return d;
}
function hydrate(){document.querySelectorAll('img[data-i]').forEach(function(e){if(!e.getAttribute('src'))need(e.dataset.i)})}
var PF=false,cgT=0;
function cgCuenta(){var n=0;S.imgs.forEach(function(m){if(IM[ik(m)])n++});return n}
/* Indicador: imágenes que se están cargando; cuando ya están, se ven con la calidad con la que se subieron */
function cgPintar(fin){
  var e=$('#cg');if(!e)return;var t=S.imgs.length,d=cgCuenta();clearTimeout(cgT);
  if(!t||(d>=t&&!fin)){e.hidden=true;return}
  if(d>=t){e.className='ok';e.innerHTML='<i></i>✓ Todas las imágenes cargadas';e.hidden=false;cgT=setTimeout(function(){e.hidden=true},3500);return}
  e.className=PF?'':'off';e.innerHTML='<i></i>'+(PF?'Cargando imágenes · ':'Imágenes por cargar · ')+d+' de '+t;e.hidden=false}
async function prefetch(){if(PF)return;PF=true;var d0=cgCuenta();cgPintar();try{for(var i=0;i<S.imgs.length;i++){await need(S.imgs[i].id);if(i%3===0)cgPintar()}}finally{PF=false;cgPintar(cgCuenta()>d0)}}
function im(m,alt){return '<img data-i="'+m.id+'" alt="'+esc(alt||'')+'"'+(IM[ik(m)]?' src="'+IM[ik(m)]+'"':'')+'>'}
var AO='cat',MIX=null,allY=0,curG='';
function mixNew(){var a=S.imgs.map(function(m){return m.id});for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}MIX=a}
function allList(){return collapse(allList0())}
function allList0(){
  if(AO==='mix'){if(!MIX)mixNew();var k={};S.imgs.forEach(function(m){k[m.id]=m});var l=MIX.filter(function(id){return k[id]}).map(function(id){return k[id]});S.imgs.forEach(function(m){if(MIX.indexOf(m.id)<0){MIX.push(m.id);l.push(m)}});return l}
  if(AO==='sin')return S.imgs.filter(function(m){return m.stock!=null&&!(m.stock>0)}).sort(function(a,b){return (a.t||0)-(b.t||0)});
  if(AO==='ex')return S.imgs.filter(function(m){return m.stock>0}).sort(function(a,b){return b.stock-a.stock||(a.t||0)-(b.t||0)});
  var co={};S.cats.forEach(function(c){co[c.id]=c.t||0});
  return S.imgs.slice().sort(function(a,b){return (co[a.cat]||0)-(co[b.cat]||0)||(a.t||0)-(b.t||0)});
}
var norm=function(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')};
const smNorm = s => norm(s).replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
function smLev(a, b) { const m = a.length, n = b.length; if (Math.abs(m - n) > 2) return 9; const d = []; for (let i = 0; i <= m; i++) { d[i] = [i]; } for (let j = 0; j <= n; j++) d[0][j] = j; for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) { d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1); } return d[m][n]; }
function smSub(w, x) { if (w[0] !== x[0]) return false; let i = 0; for (let k = 0; k < x.length && i < w.length; k++) if (x[k] === w[i]) i++; return i === w.length; }
/* Devuelve 0 si no coincide; mientras más alto, mejor coincide. */
function smartScore(q, text) {
  const qt = smNorm(q).split(' ').filter(Boolean); if (!qt.length) return 1;
  const t = smNorm(text), words = t.split(' '); let total = 0;
  for (const w of qt) {
    let b = 0;
    if (words.includes(w)) b = 100; else if (words.some(x => x.startsWith(w))) b = 80; else if (t.includes(w)) b = 60;
    else if (w.length >= 3 && words.some(x => smSub(w, x))) b = 35;
    else if (w.length >= 4 && words.some(x => smLev(w, x.slice(0, w.length)) <= (w.length >= 7 ? 2 : 1) || smLev(w, x) <= 1)) b = 25;
    if (!b) return 0; total += b;
  }
  return total + (t.startsWith(qt[0]) ? 20 : 0);
}

function cod(m){return m.clave?'<span class="cl">Código: '+esc(m.clave)+'</span> ':''}
function pe(m){var b=m.stock==null?'':'<b class="bg'+(m.stock>0?'':' no')+'">'+(m.stock>0?'En existencia: '+(+m.stock):'Agotado')+'</b>',p=Number(m.pr)>0?'<b class="pp">'+money(m.pr)+'</b>':'';return (b||p)?'<div class="pe">'+b+p+'</div>':''}
function exs(m){return pe(m)}
function allView(keep){
  scr='all';var l=allList();
  var h='<header><button class="ic g" data-a="home">←</button><h1>Todas las imágenes</h1></header><div class="seg"><button data-a="ao" data-id="mix" class="'+(AO==='mix'?'on':'')+'">Mezcladas</button><button data-a="ao" data-id="cat" class="'+(AO==='cat'?'on':'')+'">Por categoría</button><button data-a="ao" data-id="ex" class="'+(AO==='ex'?'on':'')+'">Más existencia</button><button data-a="ao" data-id="sin" class="'+(AO==='sin'?'on':'')+'">Sin existencia</button></div><div id="st">'+esc(ST)+'</div>';
  if(!l.length)h+='<div class="empty" style="flex:1">'+(AO==='sin'?'No hay productos agotados.':'Todavía no hay imágenes.')+'</div>';
  else h+='<div id="res"><div class="grid">'+l.map(function(m){if(m.isg)return '<div class="tile" data-a="allopen" data-id="'+m.id+'"><div class="cov">'+gMos(m)+'</div><small>'+esc(m.name)+'<br><i>'+m.ms.length+' presentaciones</i></small></div>';return '<div class="tile" data-a="allopen" data-id="'+m.id+'"><div class="cov">'+im(m,m.name)+'</div><small>'+esc(m.name)+'<br>'+cod(m)+pe(m)+'</small></div>'}).join('')+'</div></div>';
  $('#app').innerHTML=h;hydrate();var r=$('#res');if(r&&keep)r.scrollTop=allY;
}
function allCar(g){
  scr='allcar';var l=allList();
  var h='<header><button class="ic g" data-a="allback">←</button><h1>'+(AO==='mix'?'Mezcladas':AO==='ex'?'Más existencia':AO==='sin'?'Sin existencia':'Por categoría')+'</h1></header><div class="car" id="car">'+l.map(slide).join('')+'</div><div class="cnt" id="cnt"></div>';
  $('#app').innerHTML=h;hydrate();
  var car=$('#car');g=Math.max(0,Math.min(g,l.length-1));var u=function(){idx=Math.round(car.scrollLeft/car.clientWidth);$('#cnt').textContent=(idx+1)+' / '+l.length;var m=l[idx];if(m)for(var k=idx-1;k<=idx+1;k++)if(l[k])(l[k].isg?l[k].ms:[l[k]]).forEach(function(x){need(x.id)})};car.addEventListener('scroll',u);car.scrollLeft=g*car.clientWidth;u();
}
function ex(m){return (m.clave?'<div class="cl">Código: '+esc(m.clave)+'</div>':'')+pe(m)}
function setSt(s){ST=s;var e=$('#st');if(e)e.textContent=s}
async function post(b){var r=await fetch(cfg.u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)});return r.json()}
async function login(){var r=await post({action:'acc_login',rol:'c',id:cfg.i,llave:cfg.k,neg:cfg.n});if(r.ok&&r.ctoken){cfg.tok=r.ctoken;sv('cfgv',cfg)}return r}
async function call(b){
  if(!cfg.tok){var l=await login();if(!l.ok)throw new Error(l.error||'Acceso inválido')}
  var r=await post(Object.assign({ctoken:cfg.tok},b));
  if(r&&r.sesion){var l2=await login();if(!l2.ok)throw new Error(l2.error||'Acceso inválido');r=await post(Object.assign({ctoken:cfg.tok},b))}
  return r;
}
var pulling=false;
async function pull(){
  if(!cfg.k||pulling)return;pulling=true;
  try{
    var d=await call({action:'cat_list'});
    if(d.ok){var ch=JSON.stringify([d.cats,d.imgs,d.groups||[],d.mon])!==JSON.stringify([S.cats,S.imgs,S.groups||[],S.mon]);S={v:d.v,cats:d.cats,imgs:d.imgs,groups:d.groups||[],mon:d.mon||'C$'};sv('Sv',S);setSt('');if(ch)refresh();prefetch()}
    else setSt(d.error||'No se pudo actualizar')
  }catch(e){setSt('Sin conexión: mostrando la última copia guardada')}
  finally{pulling=false}
}
function b64u(x){return Uint8Array.from(atob(x.replace(/-/g,'+').replace(/_/g,'/')),function(c){return c.charCodeAt(0)})}
async function leerArchivo(text){
  try{
    var m=String(text).trim().split(/\s+/);if(m[0]!=='XPLUS-ACCESO-1'||!m[1])throw 0;
    var key=await crypto.subtle.importKey('raw',await crypto.subtle.digest('SHA-256',new TextEncoder().encode('XPLUS|ACCESO|v1')),'AES-GCM',false,['decrypt']);
    var all=b64u(m[1]),o=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:all.slice(0,12)},key,all.slice(12))));
    if(!o||!o.u||!o.n||o.r!=='c'||!o.i||!o.k)throw 0;return o;
  }catch(e){throw new Error('El archivo no es de un catálogo o está dañado. Pide uno nuevo a tu administrador.')}
}
function setup(msg){
  scr='set';
  $('#app').innerHTML='<header><h1>Vincular catálogo</h1>'+(cfg.k?'<button class="g" data-a="home">Cerrar</button>':'')+'</header><div class="set"><p>Elige el archivo de activación del catálogo que creó el administrador en Inventario (Configuración → Catálogo · vinculación).</p>'+(msg?'<p style="color:var(--wn)">'+esc(msg)+'</p>':'')+'<button data-a="pickfile">Elegir archivo de activación</button><input id="af" type="file" style="display:none"></div>';
  $('#af').onchange=async function(){var f=this.files[0];if(!f)return;try{var o=await leerArchivo(await f.text());var old=cfg;cfg={u:o.u,n:o.n,i:o.i,k:o.k};var l=await login();if(!l.ok){cfg=old;throw new Error(l.error||'Acceso inválido')}sv('cfgv',cfg);S={v:-1,cats:[],imgs:[]};sv('Sv',S);home();pull()}catch(e){setup(e.message)}}
}
function home(){
  if(!cfg.k){setup();return}
  scr='home';cur=null;
  $('#app').innerHTML='<header><h1>Catálogo</h1><button class="ic g" data-a="setup">⚙</button></header><div class="row"><input id="q" type="search" placeholder="Buscar categoría o imagen" value="'+esc(q)+'"></div><div class="row"><button data-a="all" class="g" style="flex:1">Ver todas las imágenes ('+S.imgs.length+')</button></div><div id="st">'+esc(ST)+'</div><div id="res"></div>';
  results();
}
function results(){
  var el=$('#res');if(!el)return;
  var qq=q.trim(),cs=S.cats.slice().sort(by).filter(function(c){return !qq||smartScore(qq,c.name)>0}),h='';
  if(!cs.length&&!qq)h='<div class="empty">Todavía no hay nada en el catálogo.<br>Conéctate a internet para descargarlo.</div>';
  else{
    if(cs.length)h+='<div class="grid">'+cs.map(function(c){var l=catItems(c.id),m=l[0];return '<div class="cat" data-a="open" data-id="'+c.id+'"><div class="cov">'+(m?im(cov(m)):'▦')+'</div><b>'+esc(c.name)+'</b><small>'+l.length+(l.length==1?' imagen':' imágenes')+'</small></div>'}).join('')+'</div>';
    if(qq){
      var ms=collapse(S.imgs.map(function(m){return [m,smartScore(qq,(m.name||'')+' '+(m.clave||'')+' '+((m.g&&gOf(m.g))?gOf(m.g).name:''))]}).filter(function(x){return x[1]>0}).sort(function(a,b){return b[1]-a[1]}).map(function(x){return x[0]}));
      if(ms.length)h+='<h2>Imágenes</h2><div class="grid">'+ms.map(function(m){if(m.isg)return '<div class="cat" data-a="opengrp" data-id="'+m.id+'"><div class="cov">'+gMos(m)+'</div><b>'+esc(m.name)+'</b><small>'+m.ms.length+' presentaciones'+gDesde(m)+'</small></div>';return '<div class="cat" data-a="openimg" data-id="'+m.id+'"><div class="cov">'+im(m)+'</div><b>'+esc(m.name)+'</b><small>'+cod(m)+(m.stock==null?'':m.stock>0?'Existencia: '+(+m.stock):'Agotado')+'</small></div>'}).join('')+'</div>';
      if(!cs.length&&!ms.length)h='<div class="empty">Sin resultados para “'+esc(q.trim())+'”.</div>';
    }
  }
  el.innerHTML=h;hydrate();
}
function slide(m){if(m.isg)return '<div class="sl gsl" data-a="opengrp" data-id="'+m.id+'">'+gMos(m)+'<div class="ct">'+esc(m.name)+'<div class="cl">'+m.ms.length+' presentaciones'+gDesde(m)+'</div><div class="gver">Toque para ver presentaciones y precios</div></div></div>';return '<div class="sl">'+im(m,m.name)+'<div class="ct">'+esc(m.name)+ex(m)+'</div></div>'}
var gFrom='home';
function grpView(id,from){
  var g=gOf(id),it=g&&gItem(g);if(!it){home();return}
  scr='grp';
  var h='<header><button class="ic g" data-a="grpback">←</button><h1>'+esc(it.name)+'</h1></header><div id="st">'+esc(ST)+'</div><div class="gscroll"><div class="gstrip">'+it.ms.map(function(m){return '<div class="gp">'+im(m,m.name)+'</div>'}).join('')+'</div><div class="gnote">Fotos originales de cada presentación · deslice →</div><div class="glist">'+it.ms.map(function(m){return '<div class="gr"><div class="gt">'+im(m,m.name)+'</div><div class="gi"><b>'+esc(m.name)+'</b><small>'+(m.clave?esc(m.clave)+' · ':'')+(m.stock==null?'':m.stock>0?'Existencia: '+(+m.stock):'Agotado')+'</small></div><span class="gpr">'+money(m.pr)+'</span></div>'}).join('')+'</div></div>';
  $('#app').innerHTML=h;hydrate();
}
function catView(keep){
  var c=S.cats.find(function(x){return x.id===cur});if(!c){home();return}
  scr='cat';var l=catItems(c.id),g=keep?idx:0;
  var h='<header><button class="ic g" data-a="home">←</button><h1>'+esc(c.name)+'</h1></header><div id="st">'+esc(ST)+'</div>';
  if(!l.length)h+='<div class="empty" style="flex:1">Esta categoría aún no tiene imágenes.</div>';
  else h+='<div class="car" id="car">'+l.map(slide).join('')+'</div><div class="cnt" id="cnt"></div>';
  $('#app').innerHTML=h;hydrate();
  var car=$('#car');
  if(car){g=Math.max(0,Math.min(g,l.length-1));var u=function(){idx=Math.round(car.scrollLeft/car.clientWidth);$('#cnt').textContent=(idx+1)+' / '+l.length};car.addEventListener('scroll',u);car.scrollLeft=g*car.clientWidth;u()}
}
function refresh(){if(scr==='all'){var r=$('#res');allY=r?r.scrollTop:allY;allView(true)}else if(scr==='cat')catView(true);else if(scr==='grp'){var gs=$('.gscroll'),y1=gs?gs.scrollTop:0;grpView(curG);var g2=$('.gscroll');if(g2)g2.scrollTop=y1}else if(scr==='home'){var a=document.activeElement;if(a&&a.id==='q')results();else home()}}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');if(!t)return;var a=t.dataset.a,id=t.dataset.id;
  if(a==='home')home();
  else if(a==='setup')setup();
  else if(a==='pickfile')$('#af').click();
  else if(a==='all'){allY=0;allView(false)}
  else if(a==='ao'){if(id==='mix')mixNew();AO=id;allY=0;allView(false)}
  else if(a==='allopen'){var r0=$('#res');allY=r0?r0.scrollTop:0;var l0=allList();allCar(l0.findIndex(function(x){return x.id===id}))}
  else if(a==='allback')allView(true);
  else if(a==='open'){cur=id;idx=0;catView(false)}
  else if(a==='opengrp'){curG=id;gFrom=scr==='cat'?'cat':scr==='allcar'?'allcar':'home';grpView(id)}
  else if(a==='grpback'){if(gFrom==='cat')catView(true);else if(gFrom==='allcar')allCar(idx);else home()}
  else if(a==='openimg'){var m=S.imgs.find(function(x){return x.id===id});if(m){cur=m.cat;idx=catItems(m.cat).findIndex(function(x){return (x.isg?x.ms.some(function(y){return y.id===id}):x.id===id)});catView(true)}}
});
document.addEventListener('input',function(e){if(e.target.id==='q'){q=e.target.value;results()}});
document.addEventListener('keydown',function(e){var car=$('#car');if(car){if(e.key==='ArrowRight')car.scrollBy({left:car.clientWidth,behavior:'smooth'});if(e.key==='ArrowLeft')car.scrollBy({left:-car.clientWidth,behavior:'smooth'})}});
window.addEventListener('online',pull);
document.addEventListener('visibilitychange',function(){if(!document.hidden)pull()});
setInterval(function(){if(!document.hidden)pull()},10000);
home();pull();
</script>
</body>
</html>
